name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Smoke-test routing through worker.mjs
        run: |
          npm run preview > preview.log 2>&1 &
          for i in $(seq 30); do curl -fs -o /dev/null http://localhost:4173/en/ && break; sleep 1; done
          npm run smoke -- http://localhost:4173

      - name: Check deploy bundle
        run: node scripts/cf-assets.mjs check
